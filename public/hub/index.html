<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a14" />
    <title>Grabbit 2.0</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="stylesheet" href="/hub/hub.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side" id="side" aria-label="Main menu">
        <a class="brand" href="#/">
          <img src="/logo.svg" alt="" width="56" height="56" />
          <span>
            <strong>Grabbit 2.0</strong>
            <small id="brandSub">Media hub</small>
          </span>
        </a>
        <nav class="nav" id="nav"></nav>
        <section class="apps" id="appsBox" hidden>
          <h3>Connected apps</h3>
          <ul id="appsList"></ul>
        </section>
        <footer class="side-foot">
          <a href="/classic/" title="The full Grabbit 1 interface">Classic view</a>
          <span id="version">v2.0.0</span>
        </footer>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <div class="main">
        <header class="top">
          <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="side">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <form class="search" id="searchForm" role="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <input id="searchInput" type="search" placeholder="Search media and creators" autocomplete="off" />
            <kbd>Ctrl K</kbd>
          </form>
          <form class="logout" method="post" action="/logout">
            <button class="icon-btn" title="Sign out" aria-label="Sign out">
              <svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" /></svg>
            </button>
          </form>
        </header>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="/hub/hub.js"></script>
  </body>
</html>
